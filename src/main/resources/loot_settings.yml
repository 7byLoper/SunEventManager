hidden_loot:
  # Если false, настоящий лут сразу отображается в сундуке.
  enabled: false

  # При включённом скрытии вместо настоящего предмета показывается
  # случайная заглушка из списка. Первый клик раскрывает настоящий предмет,
  # второй уже позволяет забрать его.
  items:
    default:
      material: GRAY_STAINED_GLASS_PANE
      display_name: '&#E7E7E7Неизвестный предмет'
      lore:
        - '&7Нажмите, чтобы раскрыть предмет.'

take_delay:
  # Запрет на изъятие лута после открытия сундуков ивента.
  enabled: false
  seconds: 10

  # Включает стандартную minecraft-анимацию cooldown на материалах,
  # которые сейчас отображаются в сундуке.
  visual_cooldown: true

  # Защита от спама сообщением при частых кликах.
  message_interval_ms: 750
  message: '&#FF2222▶&f Предметы можно будет забрать через &#FF2222{time}&f.'
